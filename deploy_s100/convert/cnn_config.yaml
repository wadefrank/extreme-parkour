# S100 BPU 模型转换配置
# 使用 hb_compile 命令执行转换
# 参考: https://toolchain.d-robotics.cc/guide/ptq/ptq_tool/hb_compile/convert.html

model_parameters:
  onnx_model: '../models/cnn_backbone_sim.onnx'
  march: 'nash-e'                   # S100 BPU 架构
  output_model_file_prefix: 'cnn_backbone'
  working_dir: './model_output'

input_parameters:
  input_name: 'depth_image'
  input_type_train: 'featuremap'    # 非图像输入，使用 featuremap
  input_layout_train: 'NCHW'
  input_type_rt: 'featuremap'
  input_shape: '1x1x58x87'

calibration_parameters:
  cal_data_dir: './calibration_data'
  # 每个 .npy 文件为一个样本, shape [1, 1, 58, 87]

compiler_parameters:
  compile_mode: 'latency'
  core_num: 1
  optimize_level: 'O2'
  jobs: 8
