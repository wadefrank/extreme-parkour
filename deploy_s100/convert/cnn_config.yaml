# S100 BPU 模型转换配置
# 用于将 CNN backbone ONNX 模型转换为 BPU 可运行的 .bin 格式
# 使用 hb_mapper makertbin 命令执行转换

model_parameters:
  onnx_model: '../models/cnn_backbone_sim.onnx'
  march: 'bernoulli2'           # S100 BPU 架构
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  input_type_rt: 'featuremap'
  input_shape: '1x1x58x87'
  norm_type: 'none'             # 预处理在代码中完成

calibration_parameters:
  cal_data_dir: './calibration_data'
  calibration_type: 'default'
  # 可选: 如果默认量化精度不够，尝试以下选项
  # calibration_type: 'kl'       # KL 散度校准
  # per_channel: true            # 逐通道量化

compiler_parameters:
  optimize_level: 'O3'
  core_num: 1
  debug: false
